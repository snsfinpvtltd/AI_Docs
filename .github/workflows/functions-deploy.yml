name: Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/ClinicalAgent.Functions/**'
      - 'src/ClinicalAgent.Core/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ClinicalAgent.sln

      - name: Publish
        run: |
          dotnet publish src/ClinicalAgent.Functions/ClinicalAgent.Functions.csproj \
            -c Release -o ./publish/functions

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: ./publish/functions
          respect-funcignore: true
