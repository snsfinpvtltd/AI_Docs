<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e040fb"/>
      <stop offset="52%"  stop-color="#8b24f0"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>

  <!--
    White circuit-brain head icon
    Profile facing RIGHT; back of head on LEFT where circuits emerge.

    Path:
      - M19,3            top of forehead
      - C25,3 29,8 29,14  right (face) side of skull
      - C29,20 25,24 21,25.5  jaw / chin curve
      - L21,29 L17,29    front + back of neck bottom
      - L17,25.5         neck back
      - C13,24 11,20 11,14  back of lower skull
      - L7,14 L7,11      horizontal + vertical circuit notch (back of head)
      - L4,11 L4,9 L7,9  L-shaped notch (circuit interface)
      - C8,5.5 13,3 19,3  upper back of skull back to start
  -->
  <path fill="white"
    d="M19,3 C25,3 29,8 29,14 C29,20 25,24 21,25.5
       L21,29 L17,29 L17,25.5
       C13,24 11,20 11,14
       L7,14 L7,11 L4,11 L4,9 L7,9
       C8,5.5 13,3 19,3 Z"/>

  <!-- Circuit lines + dots extending left from back of head -->
  <!-- Top notch exit -->
  <line x1="4" y1="10" x2="1.5" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="1" cy="10" r="1.5" fill="white"/>

  <!-- Mid circuit -->
  <line x1="11" y1="17" x2="4" y2="17" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="3" cy="17" r="1.5" fill="white"/>

  <!-- Lower circuit -->
  <line x1="12" y1="21" x2="5" y2="21" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="4" cy="21" r="1.2" fill="white"/>
</svg>
